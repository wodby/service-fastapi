name: fastapi
type: service
from: python
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.12"
title: Python (FastAPI)
labels:
- fastapi
- python

env:
- name: WORKSPACE_PYTHON_COMMAND
  value: 'python -m uvicorn "$GUNICORN_APP" --host "$HOST" --port "$PORT" --reload'
- name: GUNICORN_APP
  value: main:app
- name: GUNICORN_WORKER_CLASS
  value: uvicorn_worker.UvicornWorker

build:
  dockerfile: Dockerfile
  connect: true
  boilerplates:
  - name: fastapi
    title: FastAPI boilerplate
    repo: https://github.com/wodby/fastapi-boilerplate
    branch: main

workspace:
  reload: watch
